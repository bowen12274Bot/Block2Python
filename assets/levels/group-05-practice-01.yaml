prompt: |
  劇情：
  你踏進城堡外圍偵查區，必須快速統計巡邏訊號的特徵，
  才能開啟第一道機關門。

  任務：
  第一行輸入整數 n。
  接著輸入 n 個整數（每行一個）。

  請輸出兩個整數（同一行，以空白分隔）：
  1) 大於等於 0 的數量
  2) 奇數的數量
learning_markdown: |
  目標：同時維護兩個計數器。
  每讀到一個值，就分別檢查是否符合兩個條件。
