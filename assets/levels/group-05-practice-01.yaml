prompt: |
  Read an integer n.
  Then read n integers, one per line.

  Print two numbers:
  1. how many numbers are greater than or equal to 0
  2. how many numbers are odd
learning_markdown: |
  You can solve this with a loop and int(input()) only.
  No map(), split(), or list() is needed.
  Example structure:
  n = int(input())
  non_negative_count = 0
  odd_count = 0
  for _ in range(n):
      x = int(input())
      ...
  print(non_negative_count, odd_count)
