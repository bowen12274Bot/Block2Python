level_id: practice-basic-io-double
title: 練習關：輸出兩倍值
chapter_id: basic-io
order_index: 102
prerequisite_level_ids:
  - practice-basic-io-sum

prompt: |
  讀取一個整數 n，輸出它的兩倍。

  例如輸入：
  6

  應輸出：
  12

learning_markdown: |
  目標：練習讀入單一整數並輸出簡單運算結果。

  提示：
  ```python
  n = int(input())
  print(n * 2)
  ```

story_intro_markdown: |
  最後一題要你恢復能源放大器，讓輸入值可以正確轉成兩倍輸出。

story_outro_markdown: |
  成功，這一段主流程已經可以安全回到地圖。

testcases:
  - name: even
    stdin_file: cases/basic-io-double/01.in
    expected_stdout_file: cases/basic-io-double/01.out
  - name: negative
    stdin_file: cases/basic-io-double/02.in
    expected_stdout_file: cases/basic-io-double/02.out

judge_policy:
  time_limit_ms: 10000
  memory_limit_mb: 384
  output_normalization:
    strip_trailing_whitespace: true
    normalize_newlines_to_lf: true
    strip_trailing_newline: true

