prompt: |
  劇情：
  你抵達峽谷吊橋控制台，橋面更新週期採用閏年規則。

  任務：
  讀入整數 year。
  若 year 為閏年輸出 LEAP，否則輸出 COMMON。

  規則：
  - 可被 400 整除，或
  - 可被 4 整除且不可被 100 整除。
learning_markdown: |
  目標：練習複合條件（and / or）判斷。
  建議先拆成兩段布林條件，再合併輸出。
story_intro_markdown: |
  Byte 說：「橋面重置週期很挑剔，少一個條件都會判錯。」
story_outro_markdown: |
  橋面機構啟動，控制台顯示 `Calendar lock matched.`
