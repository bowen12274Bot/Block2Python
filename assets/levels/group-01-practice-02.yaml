prompt: |
  劇情：
  走廊內兩組感測器回傳獨立數值。你需要先合併它們，
  中央控制器才會判定訊號穩定。

  任務：
  從標準輸入依序讀入兩個整數 a、b（每行一個），輸出它們的總和。

  你只需要輸出一個整數：a + b。
learning_markdown: |
  目標：練習數值輸入、變數儲存與加法運算。
  建議流程：
  1. 連續讀入兩個整數。
  2. 計算 a + b。
  3. 輸出結果。
story_intro_markdown: |
  第二道終端啟動，螢幕只顯示一行訊息：
  「同步兩個數值訊號，回報合成結果。」
story_outro_markdown: |
  合成數值驗證成功。
  Input Gate 的訊號合併模組恢復，前往下一個節點。
