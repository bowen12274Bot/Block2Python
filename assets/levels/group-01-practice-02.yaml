prompt: |
  任務：
  從標準輸入讀入兩個整數 a、b，輸出它們的總和。

  你只需要輸出一個整數：a + b。
learning_markdown: |
  目標：練習最基本的數值輸入與算術輸出。
  建議流程：
  1. 連續讀入兩個整數。
  2. 計算 a + b。
  3. 輸出結果。
story_intro_markdown: |
