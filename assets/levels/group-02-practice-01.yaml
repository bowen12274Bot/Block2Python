prompt: |
  劇情：
  Memory Ledger 接上後，你需要讓系統同時保存兩個數值。

  任務：
  第一行輸入整數 a。
  第二行輸入整數 b。

  依序輸出兩行：
  sum=<a+b>
  diff=<a-b>
learning_markdown: |
  目標：用變數保存資料，並進行基本運算。
  建議步驟：
  1. 讀入 a、b。
  2. 建立 sum_value 與 diff_value 變數。
  3. 依指定格式輸出。
story_intro_markdown: |
  Byte 指著兩條跳動曲線：「系統要同時記錄總量和差值，不能只存一個數。」
story_outro_markdown: |
  雙指標面板亮起，系統回覆 `Metrics synchronized.`
