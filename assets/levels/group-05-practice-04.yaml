prompt: |
  劇情：
  王座前最後一層防線會紀錄每名守衛的編號值。
  你要找出最後一個「偶數編號」守衛的位置，才能避開巡邏路線。

  任務：
  第一行輸入整數 n。
  接著輸入 n 個整數（每行一個）。

  請輸出最後一個偶數出現的 1-based 位置。
  若沒有偶數，輸出 0。
learning_markdown: |
  目標：練習在迴圈中持續覆寫答案。
  每次遇到偶數就更新位置，最後留下的就是最末位置。
story_intro_markdown: |
  守門 AI 倒數中：「只剩最後一道巡邏網，定位最後守衛！」
story_outro_markdown: |
  巡邏路線破解完成，你已站上王座入口階梯。
