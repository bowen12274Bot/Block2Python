prompt: |
  劇情：
  你駭入主塔訊號牆，要找出當前最強訊號值，
  才能鎖定王座核心的座標。

  任務：
  第一行輸入整數 n。
  接著輸入 n 個整數（每行一個）。

  請輸出其中的最大值。
learning_markdown: |
  目標：練習在迴圈中持續更新「目前最大值」。
  先把第一個值當作初始最大值，再逐步比較更新。
story_intro_markdown: |
  守門程式警告：「找不到峰值，就無法進入下一層。」
story_outro_markdown: |
  峰值座標已標記，地圖浮現前往次核心的路線。
