level_id: practice-basic-io-sum
title: 練習關：兩數相加
chapter_id: basic-io
order_index: 101
prerequisite_level_ids:
  - demo-basic-io-hello
next_level_ids:
  - practice-basic-io-double

prompt: |
  讀取兩行整數 a 和 b，輸出它們的和。

  例如輸入：
  2
  5

  應輸出：
  7

learning_markdown: |
  目標：練習連續讀取兩次 `input()`，再輸出加總結果。

  提示：
  ```python
  a = int(input())
  b = int(input())
  print(a + b)
  ```

story_intro_markdown: |
  第一題練習要你修好補給統計器，讓系統能把兩筆數量正確加總。

story_outro_markdown: |
  做得好，補給統計器恢復了。再完成最後一題就能回到地圖。

testcases:
  - name: basic
    stdin_file: cases/basic-io-sum/01.in
    expected_stdout_file: cases/basic-io-sum/01.out
  - name: zero
    stdin_file: cases/basic-io-sum/02.in
    expected_stdout_file: cases/basic-io-sum/02.out

judge_policy:
  time_limit_ms: 10000
  memory_limit_mb: 384
  output_normalization:
    strip_trailing_whitespace: true
    normalize_newlines_to_lf: true
    strip_trailing_newline: true

metadata:
  stage: godot-vertical-slice
  track: quest-map
  difficulty: easy
  topics:
    - input
    - arithmetic
