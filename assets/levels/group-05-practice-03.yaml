prompt: |
  劇情：
  城堡次核心要求你統計「達到警戒門檻」的訊號數量，
  用來估算防禦系統的強度。

  任務：
  第一行輸入整數 n。
  第二行輸入整數 k（警戒門檻）。
  接著輸入 n 個整數（每行一個）。

  請輸出有多少個數值大於等於 k。
learning_markdown: |
  目標：把條件判斷放進迴圈，進行條件計數。
  只有在 `x >= k` 時才更新計數器。
