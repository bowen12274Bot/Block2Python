level_id: group-01-demo
title: "Input Gate: Signal Calibration"
chapter_id: map-groups
order_index: 1000
prompt: |
  劇情：
  這一關的重點，是學會積木對應到的 Python 程式碼是什麼。
learning_markdown: |
  目標：認識這兩個積木會變成什麼 Python。

  1. input 積木
  作用：讀入一行文字
  對應的 Python 寫法：
  input()

  2. print 積木
  作用：把內容輸出到畫面上
  對應的 Python 寫法：
  print(...)

  在這個右側工作區，你會看到「input text」和「輸出」積木。
  你可以將積木拖出來，再按 Convert 就能看到下方轉換成 Python 的程式了。

  記住：
  - input 是「讀進來」
  - print 是「印出去」
  - 積木拼出的流程，可以轉成對應的 Python 程式
story_intro_markdown: |
  Byte 發現 Input Gate 的主控台終於重新連上了，但訊號還不穩定。
  在正式開門之前，必須先送出一組校準代號，確認系統還能正確接收與回傳資料。

  Transmit codename for calibration.`
story_outro_markdown: |
  控制台回傳：`Signal accepted.`

  代表這組校準訊號已經成功送達。
  Input Gate 的基本通訊流程恢復正常，可以繼續進入下一步訓練。
