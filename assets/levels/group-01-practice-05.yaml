prompt: |
  劇情：
  最後一道門啟動線性控制鎖，
  你必須輸出正確控制值才能離開 Input Gate 區域。

  任務：
  從標準輸入依序讀入三個整數 a、b、x（每行一個），輸出：
  a * x + b
learning_markdown: |
  目標：整合多個變數與線性公式計算。
  建議流程：
  1. 讀入 a、b、x。
  2. 計算 a * x + b。
  3. 輸出結果。
