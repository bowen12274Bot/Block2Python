prompt: |
  劇情：
  你要一次讀取一批能量數據，計算總能量以穩定實驗艙。

  任務：
  第一行輸入整數 n。
  接著輸入 n 個整數（每行一個）。
  輸出這 n 個整數的總和。
learning_markdown: |
  目標：練習「先讀筆數，再迴圈讀資料」的常見模式。
  先讀 n，再讓迴圈跑 n 次累加。
story_intro_markdown: |
  Byte 說：「這是批次資料，不是固定兩三筆，必須用迴圈吃完整包。」
story_outro_markdown: |
  實驗艙壓力回穩，面板顯示 `Batch aggregation complete.`
