prompt: |
  劇情：
  兩座訊號塔同時回報數值，系統要你判斷哪一邊更高。

  任務：
  讀入兩個整數 a、b。
  - 若 a > b，輸出 A
  - 若 a < b，輸出 B
  - 若 a == b，輸出 EQUAL
learning_markdown: |
  目標：練習 if / else if / else 三分支判斷。
  先處理大於與小於，再補上相等情況會最清楚。
story_intro_markdown: |
  Byte 說：「這不是算術題，是判斷路由優先權。」
story_outro_markdown: |
  優先塔台被鎖定，導航箭頭穩定指向前方。
