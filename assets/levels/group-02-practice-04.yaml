prompt: |
  劇情：
  基地要補能量，主槽目前有 base，
  第一段補了 add1，第二段補了 add2。

  任務：
  第一行輸入整數 base。
  第二行輸入整數 add1。
  第三行輸入整數 add2。

  依序輸出兩行：
  tank=<base+add1+add2>
  delta=<add2-add1>
learning_markdown: |
  目標：把多步驟運算拆成變數，讓程式更容易檢查。
  你可以先算 tank，再算 delta。
story_intro_markdown: |
  系統提示：「補能紀錄不一致。」
  Byte 說：「把兩段補給都記進變數，我們才能追查差值。」
story_outro_markdown: |
  補能紀錄完成重算，控制台顯示 `Refuel report confirmed.`
