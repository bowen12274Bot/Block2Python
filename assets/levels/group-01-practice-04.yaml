prompt: |
  劇情：
  你在主通道掃描到一塊矩形維修區，
  系統要求你同時回報面積與周長，才能完成區域標記。

  任務：
  從標準輸入依序讀入兩個正整數 w、h（每行一個）。
  輸出兩個整數：
  1. 面積 w * h
  2. 周長 2 * (w + h)

  請以同一行輸出，兩個數字以單一空白分隔。
learning_markdown: |
  目標：練習同時使用多個變數與多個算式。
  建議流程：
  1. 讀入 w、h。
  2. 計算 area 與 perimeter。
  3. 依格式輸出兩個結果。
story_intro_markdown: |
  控制台提示：`Upload rectangle scan report: area, perimeter.`
story_outro_markdown: |
  掃描報告通過，維修區地圖成功寫入主控台。
  Input Gate 的路徑圖已接近完整。
