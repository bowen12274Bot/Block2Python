level_id: add-two-numbers
title: 兩數相加（YAML 版本）
chapter_id: basic-io
order_index: 1

prompt: |
  讀取兩個整數 a 和 b，輸出它們的和。
  
  輸入格式：一行兩個整數，用空格分隔
  輸出格式：一個整數（a + b 的結果）

learning_markdown: |
  # 基礎輸入與輸出
  
  在 Python 中，我們用 `input()` 讀取一行輸入：
  ```python
  line = input()
  ```
  
  然後可以用 `split()` 和 `int()` 把字串轉成整數：
  ```python
  a, b = map(int, line.split())
  ```
  
  用 `print()` 輸出結果：
  ```python
  print(a + b)
  ```

story_intro_markdown: |
  你剛剛抵達程式島，島民給你出了第一道題目：「把兩個數字加起來！」

story_outro_markdown: |
  太棒了！你已經學會了基礎的輸入輸出。繼續前進吧！

testcase_dir: cases/add-two-numbers

judge_policy:
  time_limit_ms: 1000
  memory_limit_mb: 64
  output_normalization:
    strip_trailing_whitespace: true
    normalize_newlines_to_lf: true
    strip_trailing_newline: true

metadata:
