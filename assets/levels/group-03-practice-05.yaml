level_id: group-03-practice-05
title: "If Canyon: Gate Protocol"
chapter_id: map-groups
order_index: 3005
prerequisite_level_ids:
  - group-03-practice-04
prompt: |
  劇情：
  你抵達 If Canyon 終點閘門，系統要求你依優先規則做最終判斷。

  任務：
  讀入三個整數（分三行）：
  hp（0..100）、key（0 或 1）、alarm（0 或 1）。

  判斷規則：
  - 若 key == 1 且 alarm == 0，輸出 OPEN
  - 否則若 hp >= 80 且 alarm == 0，輸出 OVERRIDE
  - 否則輸出 LOCKDOWN
learning_markdown: |
  目標：練習多條件且有優先序的分支判斷。
  先寫最高優先條件，再寫次優先條件，最後留 else 收尾。
story_intro_markdown: |
  守門 AI 發出提示：「同時滿足多條件時，請遵循既定優先順序。」
story_outro_markdown: |
  閘門打開，螢幕顯示 `If Canyon cleared.`
